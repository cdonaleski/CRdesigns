<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Needlepoint Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5f5b'/%3E%3Cg fill='%23f6f2ec'%3E%3Crect x='3' y='3' width='4' height='4'/%3E%3Crect x='9' y='9' width='4' height='4'/%3E%3C/g%3E%3Cg fill='%23e0a458'%3E%3Crect x='9' y='3' width='4' height='4'/%3E%3Crect x='3' y='9' width='4' height='4'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  :root { --bg: #f6f2ec; --panel: #fffdf9; --ink: #221f1b; --muted: #6f675d; --line: #e4ddd2; --accent: #1f5f5b; --danger: #a2273a; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  .mark { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 8px; margin-bottom: 14px; }
  .mark span { border-radius: 2px; background: #f6f2ec; } .mark span:nth-child(2), .mark span:nth-child(3) { background: #e0a458; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 12px; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { min-height: 1.4em; margin: 10px 0 0; font-size: 0.9rem; }
  .msg.error { color: var(--danger); }
  .fine { margin: 16px 0 0; font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <h1>Needlepoint Studio</h1>
  <p>For CR Design Co. group members. Enter the group passphrase to open the studio.</p>
  <form id="f" autocomplete="on">
    <label for="pass">Group passphrase</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required />
    <button id="go" type="submit">Open the studio</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>
  <p class="fine">This device stays unlocked until you lock it. Your projects are saved only on this device.</p>
</main>
<script type="module">
  const msg = document.getElementById('msg')
  const go = document.getElementById('go')
  const say = (text, error = false) => { msg.textContent = text; msg.className = error ? 'msg error' : 'msg' }
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  // Same normalisation as the publish script: case and separators don't matter.
  const norm = (p) => p.normalize('NFKC').trim().toLowerCase().replace(/[\s_]+/g, '-')

  const DB = 'npstudio-lock'
  const idb = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1)
    r.onupgradeneeded = () => r.result.createObjectStore('keys')
    r.onsuccess = () => res(r.result)
    r.onerror = () => rej(r.error)
  })
  const idbDo = async (mode, fn) => {
    const db = await idb()
    return new Promise((res, rej) => {
      const tx = db.transaction('keys', mode)
      const req = fn(tx.objectStore('keys'))
      tx.oncomplete = () => res(req?.result)
      tx.onerror = () => rej(tx.error)
    })
  }

  async function manifest() {
    const r = await fetch('./manifest.json', { cache: 'no-cache' })
    if (!r.ok) throw new Error('manifest')
    return r.json()
  }
  async function derive(pass, m) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pass)), 'PBKDF2', false, ['deriveKey'])
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(m.salt), iterations: m.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
    )
  }
  async function works(key, m) {
    try {
      const buf = b64(m.check)
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12))
      return new TextDecoder().decode(plain) === 'npstudio-ok'
    } catch { return false }
  }
  async function enter() {
    await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
    await navigator.serviceWorker.ready
    location.replace('./app.html' + location.hash)
  }

  async function start() {
    if (!('serviceWorker' in navigator) || !crypto?.subtle) {
      say('This browser can’t open the studio. Please use a recent Safari, Chrome, Edge or Firefox.', true)
      go.disabled = true
      return
    }
    const params = new URLSearchParams(location.search)
    if (params.has('lock')) {
      await idbDo('readwrite', (s) => s.delete('current'))
      history.replaceState(null, '', location.pathname)
      say('This device is locked.')
      return
    }
    const m = await manifest()
    const saved = await idbDo('readonly', (s) => s.get('current'))
    if (saved && saved.salt === m.salt && await works(saved.key, m)) return enter()
    if (params.has('locked') || saved) say('Please enter the passphrase again.')
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault()
    go.disabled = true
    say('Unlocking…')
    try {
      const m = await manifest()
      const key = await derive(document.getElementById('pass').value, m)
      if (!(await works(key, m))) { say('That passphrase isn’t right. Check the spelling and try again.', true); go.disabled = false; return }
      await idbDo('readwrite', (s) => s.put({ key, salt: m.salt }, 'current'))
      await enter()
    } catch (err) {
      console.error(err)
      say('Something went wrong opening the studio. Please reload and try again.', true)
      go.disabled = false
    }
  })

  start().catch((err) => { console.error(err); say('Couldn’t reach the studio. Check your connection and reload.', true) })
</script>
</body>
</html>
